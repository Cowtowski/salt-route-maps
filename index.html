<style>
  :root{

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  button,input,select,textarea{font:inherit;color:inherit}

  #app{display:grid;grid-template-rows:auto 1fr;height:100%;height:100dvh}

  main{display:grid;grid-template-columns:360px 1fr;min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #side{overflow:auto;flex:1;padding:10px;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #map{min-height:0;height:100%}
  .row{display:flex;align-items:center;gap:8px}
  .list-item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;background:#fff}
  .list-item:hover{border-color:#c9cfdb}

  .list-item .name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list-item .name small{color:var(--muted)}
  .handle{cursor:grab;color:#a0a7b5;padding:2px 2px;user-select:none;touch-action:none}
  .swatch{width:22px;height:22px;border:none;padding:0;border-radius:50%;overflow:hidden;cursor:pointer;flex:none;background:none}

  .swatch::-moz-color-swatch{border:2px solid #fff;border-radius:50%}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 2px 6px}
  .hint{color:var(--muted);font-size:13px;padding:6px 2px}
  .place{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;background:#fff}
  .place.sel{border-color:var(--accent);box-shadow:0 0 0 2px #1a73e822}
  .place-head{display:flex;align-items:flex-start;gap:8px;padding:8px}
  .num{flex:none;min-width:24px;height:24px;border-radius:12px;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;padding:0 6px;margin-top:1px}
  .place-body{flex:1;min-width:0;cursor:pointer}

  .pop-acts button{flex:1;min-height:42px;border-radius:10px;font:700 15px system-ui,sans-serif;cursor:pointer;border:1.5px solid #188038;background:#fff;color:#188038}
  .pop-acts button.on{background:#188038;color:#fff}
  .pop-acts .pa-photo{border-color:#1a73e8;color:#1a73e8;flex:0 0 auto;padding:0 14px}
  .pop-acts{flex-wrap:wrap}

  .pop-acts .pa-timer{flex:1 1 100%}
  .pop-acts .pa-timer.run,.btn.tbtn.run{background:#d93025;border-color:#d93025;color:#fff}
  .photo{margin:-2px 0 8px;border-radius:8px;overflow:hidden;background:#e8eaed;position:relative}
  .photo-tabs{display:flex;gap:2px;position:absolute;top:6px;left:6px;z-index:2}
  .photo-tabs button{border:none;background:#000a;color:#fff;font:600 11px system-ui,sans-serif;padding:3px 8px;border-radius:5px;cursor:pointer}
  .photo-tabs button.on{background:#1a73e8}
  .photo-body{height:170px;position:relative}
  .photo-body img,.photo-body iframe{width:100%;height:170px;display:block;border:0;object-fit:cover;cursor:zoom-in}
  .photo-body .dot{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#ea4335;border:2px solid #fff;box-shadow:0 0 0 1px #0006;pointer-events:none}
  .photo-body .msg{position:absolute;inset:0;display:grid;place-items:center;color:#5f6368;font-size:12px;text-align:center;padding:10px}
  .photo-big img{width:min(900px,90vw);height:auto;display:block;border-radius:8px}
  .pickmode #map{cursor:crosshair}
  #banner{display:none;position:absolute;z-index:1000;left:50%;top:10px;transform:translateX(-50%);background:#202124;color:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px #0004}
  .pickmode #banner{display:flex;gap:10px;align-items:center}
  #banner button{background:#fff2;border:none;color:#fff;border-radius:6px;padding:3px 8px}
  .mapwrap{position:relative;min-height:0}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#202124;color:#fff;padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:2000;max-width:90vw}
  #toast.show{opacity:1}
  dialog{border:none;border-radius:14px;padding:0;max-width:min(560px,94vw);box-shadow:0 10px 40px #0004;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
  dialog::backdrop{background:#0006}
  .dlg{padding:18px 20px}
  .dlg h3{margin:0 0 8px}
  .dlg p{margin:6px 0;color:#3c4352}
  .dlg .opts{display:grid;gap:8px;margin:12px 0}
  .dlg .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
  .dlg .opt:hover{background:#f5f7fb}
  .dlg .opt small{color:var(--muted);display:block}
  .dlg footer{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .menu{position:relative}
  .menu-pop{display:none;position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px #0002;z-index:1500;min-width:230px;padding:4px}
  .menu.open .menu-pop{display:block}
  .menu-pop button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:6px}
  .menu-pop button:hover{background:#f1f3f7}
  .menu-pop hr{border:none;border-top:1px solid var(--line);margin:4px 0}
  body.viewonly .handle, body.viewonly [data-up], body.viewonly [data-down], body.viewonly [data-edit], body.viewonly #newList,
  body.viewonly #dropPin, body.viewonly #searchForm, body.viewonly #undoBtn, body.viewonly .edit-only, body.viewonly [data-act="import"],

  body.site .local-only{display:none!important}

  .pinbox{background:#e8f0fe;border:1px solid #aecbfa;border-radius:12px;padding:12px 14px;margin:6px 0 10px}
  .pinbox .pincode{font:800 26px ui-monospace,Consolas,monospace;letter-spacing:.08em;color:#174ea6;transform:none;width:auto;height:auto;border:0;box-shadow:none;display:block;word-break:break-all;margin:2px 0}
  body.crew .crew-out-only{display:none!important}
  .donebtn{border:1.5px solid #188038;color:#188038;background:#fff;border-radius:10px;min-width:44px;min-height:40px;padding:6px 10px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
  .donebtn.on{background:#188038;color:#fff}
  .donebtn.run{background:#d93025;border-color:#d93025;color:#fff;font-variant-numeric:tabular-nums}
  .actcol{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .photobtn{border:1.5px solid #1a73e8;color:#1a73e8;background:#fff;border-radius:10px;min-width:44px;min-height:38px;padding:4px 8px;font-size:17px;cursor:pointer}
  @media (max-width:760px){ .photo-body,.photo-body img,.photo-body iframe{height:120px} }
  body.lay-mobile .photo-body, body.lay-mobile .photo-body img, body.lay-mobile .photo-body iframe{height:120px}
  .updated{font-size:13px;color:var(--muted);margin:-4px 2px 10px}
  #runTime{display:none;font-size:14px;background:#f1f6fe;border:1px solid #d2e3fc;border-radius:10px;padding:8px 12px;margin:0 0 10px}
  .adminbadge{background:#fce8e6;color:#c5221f;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}

  /* ---- Clearer, roomier, bigger-text theme ---- */

const hasLoc = p => typeof p.lat === "number" && typeof p.lng === "number" && !isNaN(p.lat) && !isNaN(p.lng);

// ---------- state ----------
function blankMap(){

  if (typeof m.showLines !== "boolean") m.showLines = true;

function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }

async function sha256hex(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
function applyRole(){ document.body.classList.toggle("viewonly", !ADMIN); document.body.classList.toggle("site", !!window.__FROM_SITE); const t = $("#mapTitle"); if (t) t.readOnly = !ADMIN; }

let S = (function load(){

  if (emb && !ADMIN) return emb;   // viewers always see the published routes

  const key = "routemaps:" + (emb ? emb.id : lastId);
  const local = lsGet(key);
  // only the admin's own unpublished edits may replace the published routes (never a copy saved while signed in as a driver)
  if (emb && local && local.savedBy === "admin" && (local.savedAt||0) > (emb.savedAt||0)) return normalize(local);
  if (emb) return emb;
  if (local) return normalize(local);

})();

let ui = {openList: null, selPlace: null, editPlace: null, results: null, pick: null};
let undoStack = [];

function save(){
  if (!ADMIN && window.EMBEDDED_MAP) return;   // drivers and viewers never store their own copy of the routes
  S.savedAt = Date.now(); S.savedBy = ADMIN ? "admin" : "";

}
function commit(fn, opts={}){
  if (!ADMIN && !opts.view){ toast("View only. Only the admin can change routes."); render({noFit: true}); return; }
  undoStack.push(JSON.stringify(S)); if (undoStack.length > 60) undoStack.shift();

}
function undo(){

}
const getList = id => S.lists.find(l => l.id === id);
function findPlace(pid){ for (const l of S.lists){ const i = l.places.findIndex(p => p.id === pid); if (i > -1) return {list: l, place: l.places[i], index: i}; } return null; }

// ---------- map ----------
const map = L.map("map", {zoomControl: true, rotate: true, touchRotate: true, bearing: 0, shiftKeyRotate: true, rotateControl: {closeOnZeroBearing: true, position: "topleft"}}).setView([S.view.lat, S.view.lng], S.view.z);
const street = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  {crossOrigin: true, maxZoom: 20, maxNativeZoom: 19, attribution: "Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors"});
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
const esriAttr = "Imagery &copy; Esri, Maxar, Earthstar Geographics";
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 20, maxNativeZoom: 19, attribution: esriAttr});
const satLabels = L.layerGroup([
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 20, maxNativeZoom: 19, attribution: esriAttr}),
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", {maxZoom: 20, maxNativeZoom: 19}),
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {maxZoom: 20, maxNativeZoom: 19})
]);
const baseKey = "routemaps:base";
const bases = {"Map": street, "Satellite": sat, "Satellite + labels": satLabels, "OpenStreetMap": osm};
(bases[lsGet(baseKey)] || street).addTo(map);
L.control.layers(bases, null, {position: "topright"}).addTo(map);
map.on("baselayerchange", e => lsSet(baseKey, e.name));

function pinIcon(color, label, dim){
  return L.divIcon({className: "", iconSize: [28,28], iconAnchor: [14,28], popupAnchor: [0,-26],
    html: `<div class="pin${dim?" dim":""}" style="background:${color}"><span>${label}</span></div>`});
}
function aerialUrl(p, w=600, h=340, halfWidthM=90){
  const halfH = halfWidthM * h / w;
  const dLat = halfH / 111320, dLng = halfWidthM / (111320 * Math.cos(p.lat * Math.PI / 180));
  return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${(p.lng-dLng).toFixed(6)},${(p.lat-dLat).toFixed(6)},${(p.lng+dLng).toFixed(6)},${(p.lat+dLat).toFixed(6)}&bboxSR=4326&imageSR=3857&size=${w},${h}&format=jpg&f=image`;
}
const streetEmbed = p => `https://maps.google.com/maps?layer=c&cbll=${p.lat},${p.lng}&cbp=12,0,0,0,0&output=svembed`;
const streetLink = p => `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lng}`;
function popupHtml(l, p, i){

    </div>` : "";
  const isD = getDone(l).has(stopNum(p, i));
  const acts = `<div class="pop-acts">${timerBtnHtml(l, stopNum(p, i), `type="button" class="pa-timer" data-ptimer="${p.id}"`)}${isD ? `<button type="button" class="pa-done on" data-pdone="${p.id}">✓ Recorded · undo</button>` : ""}${logUrl() ? `<button type="button" class="pa-photo" data-pphoto="${p.id}">📷 Photo</button>` : ""}</div>`;
  return `<div class="pop">${acts}${photo}<b>${stopNum(p, i)}. ${esc(p.name || "Untitled")}</b>${p.address ? `<small>${esc(p.address)}</small>` : ""}

// Done / Photo buttons in map popups and the list (one handler, works after any re-render)
document.addEventListener("click", ev => {

    const places = f.list.places.filter((q, k) => stopNum(q, k) === num);
    doneForm(f.list, places.length ? places : [f.place], num, det => { markDone(f.list, f.place, f.index, true, det); renderSide();
      document.querySelectorAll(`[data-ptimer="${f.place.id}"]`).forEach(b => b.outerHTML = timerBtnHtml(f.list, num, `type="button" class="pa-timer" data-ptimer="${f.place.id}"`));

      if (pt2 && !document.querySelector(`[data-pdone="${f.place.id}"]`)) pt2.insertAdjacentHTML("afterend", `<button type="button" class="pa-done on" data-pdone="${f.place.id}">✓ Recorded · undo</button>`); });

function bindPhoto(el){
  const box = el.querySelector("[data-photo]"); if (!box) return;
  const f = findPlace(box.dataset.photo); if (!f) return; const p = f.place;
  const body = box.querySelector(".photo-body");
  const show = tab => {
    box.querySelectorAll("[data-ptab]").forEach(b => b.classList.toggle("on", b.dataset.ptab === tab));
    if (tab === "aerial"){
      body.innerHTML = `<div class="msg">Loading photo…</div><img alt="Aerial photo" src="${aerialUrl(p)}"><span class="dot"></span>`;
      const img = body.querySelector("img");
      img.onload = () => body.querySelector(".msg").style.display = "none";
      img.onerror = () => { img.style.display = "none"; body.querySelector(".msg").textContent = "No aerial photo available here"; };
      img.onclick = () => bigPhoto(p);
    } else {
      body.innerHTML = `<div class="msg">Loading Street View…<br><a href="${streetLink(p)}" target="_blank" rel="noopener">Open in Google Maps ↗</a></div><iframe src="${streetEmbed(p)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen title="Street View"></iframe>`;
    }
  };
  box.querySelectorAll("[data-ptab]").forEach(b => b.onclick = ev => { ev.stopPropagation(); show(b.dataset.ptab); });
  show("street");
}
function showSiteMap(p){
  const src = SM[p.smimg]; if (!src) return;
  const d = $("#dlg");
  $("#dlgBody").innerHTML = `<h3 style="margin-bottom:6px">📄 Site map · ${esc(p.name)}</h3>
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <button class="btn" id="smFit">Fit</button><button class="btn" id="smZoom">Zoom in</button>
      <button class="btn" id="smSave">⬇ Save image</button>
      ${p.sitemap ? `<a class="btn" href="${esc(p.sitemap)}" target="_blank" rel="noopener">PDF (office network)</a>` : ""}
    </div>
    <div id="smBox" style="max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fafafa;-webkit-overflow-scrolling:touch">
      <img id="smImg" src="${src}" alt="Site map for ${esc(p.name)}" style="display:block;width:100%;height:auto;cursor:zoom-in"></div>

document.addEventListener("click", e => { const a = e.target.closest && e.target.closest("[data-sm]"); if (!a) return;
  e.preventDefault(); e.stopPropagation(); const f = findPlace(a.dataset.sm); if (f) showSiteMap(f.place); }, true);
function bigPhoto(p){
  $("#dlgBody").innerHTML = `<div class="photo-big" style="position:relative"><img alt="Aerial photo" src="${aerialUrl(p, 1200, 700, 140)}"><span style="position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#ea4335;border:2px solid #fff;box-shadow:0 0 0 1px #0006"></span></div>
    <p style="margin:8px 0 0"><b>${esc(p.name)}</b>${p.address ? " · " + esc(p.address) : ""}</p>
    <footer><a class="btn" href="${streetLink(p)}" target="_blank" rel="noopener">Street View ↗</a><button class="btn" id="bpClose">Close</button></footer>`;
  $("#dlg").showModal(); $("#bpClose").onclick = () => $("#dlg").close();
}
function renderMap(){
  layer.clearLayers(); for (const k in markers) delete markers[k];
  S.lists.forEach(l => {
    if (ui.openList ? ui.openList !== l.id : !l.visible) return;
    const dim = ui.openList && ui.openList !== l.id;
    const pts = [];
    l.places.forEach((p, i) => {
      if (!hasLoc(p)) return;
      pts.push([p.lat, p.lng]);
      const editable = ui.openList === l.id;
      const m = L.marker([p.lat, p.lng], {icon: pinIcon(l.color, stopNum(p, i), dim), draggable: editable && ADMIN, zIndexOffset: dim ? 0 : 1000})
        .bindPopup(() => popupHtml(l, p, i), {minWidth: 260, maxWidth: 320, maxHeight: Math.max(220, map.getSize().y - 40), autoPanPadding: [10, 10]});
      m.on("click", () => { ui.selPlace = p.id; if (ui.openList !== l.id){ ui.openList = l.id; render({keepMap:false, noFit:true}); setTimeout(() => markers[p.id] && markers[p.id].openPopup(), 50);} else renderSide(); scrollToPlace(p.id); });
      m.on("dragend", e => { const ll = e.target.getLatLng(); commit(() => { p.lat = +ll.lat.toFixed(6); p.lng = +ll.lng.toFixed(6); }, {noFit: true}); toast("Pin moved"); });
      m.addTo(layer); markers[p.id] = m;
    });
    if (S.showLines && pts.length > 1) L.polyline(pts, {color: l.color, weight: 3, opacity: dim ? .35 : .8, dashArray: "6 6"}).addTo(layer);
  });
}
map.on("popupopen", e => {
  bindPhoto(e.popup.getElement());
  L.DomEvent.disableClickPropagation(e.popup.getElement());
  const a = e.popup.getElement().querySelector("[data-edit]");
  if (a) a.addEventListener("click", ev => { ev.preventDefault(); const f = findPlace(a.dataset.edit); if (!f) return;
    ui.openList = f.list.id; ui.selPlace = ui.editPlace = f.place.id; map.closePopup(); render({noFit: true}); scrollToPlace(f.place.id); });
});
function fitList(l){
  const pts = l.places.filter(hasLoc).map(p => [p.lat, p.lng]);
  if (pts.length === 1) map.setView(pts[0], Math.max(map.getZoom(), 16));
  else if (pts.length) map.fitBounds(pts, {padding: [40,40], maxZoom: 17});
}
function fitAll(){
  const pts = []; S.lists.forEach(l => l.visible && l.places.forEach(p => hasLoc(p) && pts.push([p.lat,p.lng])));
  if (pts.length) map.fitBounds(pts, {padding: [40,40], maxZoom: 16});
}

// ---------- geocoding (OpenStreetMap Nominatim, Photon fallback) ----------
function shortAddr(a, fallback){
  if (!a) return fallback || "";
  const line1 = [a.house_number, a.road || a.pedestrian || a.footway].filter(Boolean).join(" ");
  const city = a.city || a.town || a.village || a.suburb || a.municipality || "";
  return [line1, city].filter(Boolean).join(", ") || fallback || "";
}
async function geocode(q, limit=6){
  const b = map.getBounds();
  const vb = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].map(n => n.toFixed(4)).join(",");
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=${limit}&viewbox=${vb}&q=${encodeURIComponent(q)}`, {headers: {"Accept-Language": "en"}});
    if (!r.ok) throw 0;
    const j = await r.json();
    return j.map(x => ({name: x.name || (x.display_name||"").split(",")[0], address: shortAddr(x.address, x.display_name), full: x.display_name, lat: +x.lat, lng: +x.lon}));
  } catch(e){
    const c = map.getCenter();
    const r = await fetch(`https://photon.komoot.io/api/?limit=${limit}&lat=${c.lat}&lon=${c.lng}&q=${encodeURIComponent(q)}`);
    const j = await r.json();
    return (j.features||[]).map(f => { const p = f.properties; const line1 = [p.housenumber, p.street].filter(Boolean).join(" ");
      return {name: p.name || line1, address: [line1, p.city].filter(Boolean).join(", "), full: [p.name, line1, p.city, p.state].filter(Boolean).join(", "), lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0]}; });
  }
}
async function reverse(ll){
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=${ll.lat}&lon=${ll.lng}`, {headers: {"Accept-Language": "en"}});
    const j = await r.json(); return shortAddr(j.address, j.display_name);
  } catch(e){ return ""; }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

  <div id="lists">${S.lists.map(l => `

// ---------- Access codes: crew only ----------
// Public notes have lockbox/gate/alarm codes and phone numbers replaced with 🔒.
// The full notes live in routes-private.enc, encrypted with the crew password.
const SENS_RE = /\b(code|combo|lock ?box|key ?box|intercom|gate|passcode|password|pin|alarm)\b(\s*(?:for\s+gate\s*)?[:#-]?\s*)([A-Z]?\d[\d#]*(?:[\s,\/]+[A-Z]?\d[\d#]*)*)/gi;
const PHONE_RE = /\(?\b\d{3}\)?[-. ]\d{3}[-. ]\d{4}\b/g;
const CODEWORD_RE = /\b(code)(:?\s+)(?!for\b|left\b|in\b|to\b|on\b|is\b|at\b|the\b|box\b)([a-z]{3,})\b/gi;
function redact(t){ return String(t || "").replace(SENS_RE, (m, k, sep) => k + sep + "🔒").replace(PHONE_RE, "🔒 phone").replace(CODEWORD_RE, (m, k, sep) => k + sep + "🔒"); }
const CREW_SALT = "addcc14353cb7639", CREW_HASH = "b6be9e1ff0fa14a32173b79e33f19e1e2b9be1b679dde4df81f258445e551cd0";
let PRIV = {}, PRIV_LOADED = false;
let CREW_PW = "";
const noteOf = p => (p && PRIV[p.id]) || (p && p.note) || "";
async function pbkdf(pw, salt, use){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, [use]);
}
async function encPack(obj, pw){
  const gz = new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv}, await pbkdf(pw, salt, "encrypt"), gz));
  const out = new Uint8Array(34 + ct.length); out.set(new TextEncoder().encode("RMENC1")); out.set(salt, 6); out.set(iv, 22); out.set(ct, 34); return out;
}
async function decPack(buf, pw){
  try {
    if (new TextDecoder().decode(buf.slice(0, 6)) !== "RMENC1") return null;
    const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(22, 34)}, await pbkdf(pw, buf.slice(6, 22), "decrypt"), buf.slice(34));
    return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  } catch(e){ return null; }
}
async function crewOk(pw){ try { return (await sha256hex(CREW_SALT + pw)) === CREW_HASH; } catch(e){ return false; } }
async function loadPriv(pw){
  if (!window.__FROM_SITE) { PRIV_LOADED = true; return true; }
  try {
    const r = await fetch("routes-private.enc", {cache: "no-cache"});
    if (r.status === 404){ PRIV_LOADED = true; return true; }
    if (!r.ok) return false;
    const o = await decPack(new Uint8Array(await r.arrayBuffer()), pw); if (!o) return false;
    PRIV = o; PRIV_LOADED = true; return true;
  } catch(e){ return false; }
}

async function encRaw(obj, keyB64){
  const gz = new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
  const key = await crypto.subtle.importKey("raw", Uint8Array.from(atob(keyB64), c => c.charCodeAt(0)), "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, gz));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64e(out);

// Key for one piece of a run (its header or one stop), made from the run's key. Same in the loader.
async function subKey(keyB64, label){
  const k = await crypto.subtle.importKey("raw", Uint8Array.from(atob(keyB64), c => c.charCodeAt(0)), {name: "HMAC", hash: "SHA-256"}, false, ["sign"]);
  return b64e(new Uint8Array(await crypto.subtle.sign("HMAC", k, new TextEncoder().encode(label))));
}
// Keys a driver gets: the whole run key, or (some properties only) the header key + one key per chosen stop.
async function accessKeys(ak, runs, stops){

    if (!ak.keys[id]) continue;
    const pick = stops && stops[id];
    if (!pick) keys[id] = ak.keys[id];
    else if ((window.__RUNS_V || 1) < 2) keys[id] = {k: ak.keys[id], only: pick};   // site not re-published yet: the phone hides the other stops
    else { const s = {}; for (const n of pick) s[n] = await subKey(ak.keys[id], "stop:" + n); keys[id] = {h: await subKey(ak.keys[id], "head"), s}; }
  }

}

const ROUTERS = ["https://router.project-osrm.org", "https://routing.openstreetmap.de/routed-car"];
async function osrm(path, ms = 9000){
  for (const base of ROUTERS){
    try { const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
      const r = await fetch(base + path, {signal: c.signal}); clearTimeout(t);
      const j = await r.json(); if (j.code === "Ok" && j.routes && j.routes.length) return j; } catch(e){}
  }
  throw new Error("No route");
}
// Whole-run drive time, stops in order (cached per route shape)
const RUNT = lsGet("routemaps:runt") || {};
async function runTime(l){
  const st = navStops(l).filter(s => s.target); if (st.length < 2) return null;
  const key = st.map(s => s.target.lat.toFixed(4) + "," + s.target.lng.toFixed(4)).join(";");
  if (RUNT[l.id] && RUNT[l.id].key === key) return RUNT[l.id];
  const j = await osrm(`/route/v1/driving/${st.map(s => s.target.lng + "," + s.target.lat).join(";")}?overview=false`, 15000);
  const r = {key, dur: j.routes[0].duration, dist: j.routes[0].distance, legs: j.routes[0].legs.map(x => x.duration), nums: st.map(s => s.num)};
  RUNT[l.id] = r; lsSet("routemaps:runt", RUNT); return r;
}
function showRunTime(l){
  runTime(l).then(r => { const el = $("#runTime"); if (!r || !el || ui.openList !== l.id) return;
    el.innerHTML = `⏱ About <b>${fmtTime(r.dur)}</b> of driving · ${fmtDist(r.dist)} for ${r.nums.length} stops in order <span style="color:#6b7385">(time on site not included)</span>`; el.style.display = "block"; }).catch(() => {});
}
function runLeft(etaToStop){
  const r = NAV.runt, s = curStop(); if (!r || !s) return null;
  const k = r.nums.indexOf(s.num); if (k < 0) return null;
  return etaToStop + r.legs.slice(k).reduce((a, b) => a + b, 0);
}

function registerSW(){
  if (!("serviceWorker" in navigator) || !(location.protocol === "https:" || location.hostname === "localhost") || !window.__FROM_SITE) return;
  navigator.serviceWorker.register("sw.js").catch(() => {});

async function saveOffline(l){
  if (!window.__FROM_SITE || !navigator.serviceWorker || !navigator.serviceWorker.controller) return toast("Offline maps work on the website (cowtowski.github.io). Open it there and try again.", 4500);
  const pts = l.places.filter(hasLoc); if (!pts.length) return toast("This list has no pins");
  let s = Math.min(...pts.map(p => p.lat)), n = Math.max(...pts.map(p => p.lat)), w = Math.min(...pts.map(p => p.lng)), e = Math.max(...pts.map(p => p.lng));
  const pad = .01; s -= pad; n += pad; w -= pad; e += pad;
  const tx = (lng, z) => Math.floor((lng + 180) / 360 * 2 ** z);
  const ty = (lat, z) => Math.floor((1 - Math.log(Math.tan(toRad(lat)) + 1 / Math.cos(toRad(lat))) / Math.PI) / 2 * 2 ** z);
  const tiles = [];
  for (let z = 10; z <= 16; z++){
    const x0 = tx(w, z), x1 = tx(e, z), y0 = ty(n, z), y1 = ty(s, z), cnt = (x1 - x0 + 1) * (y1 - y0 + 1);
    if (tiles.length + cnt > 1500) break;
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) tiles.push(`https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${z}/${y}/${x}`);
  }
  let done = 0; toast(`Saving ${tiles.length} map tiles for offline…`, 3000);
  const work = async () => { while (tiles.length){ const u = tiles.pop(); try { await fetch(u, {mode: "cors"}); } catch(e){} done++; if (done % 100 === 0) toast(`Saving map for offline… ${done}`, 1500); } };
  await Promise.all([work(), work(), work(), work()]);
  toast(`✓ ${l.name} saved for offline use (${done} map tiles).`, 4000);
}

function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function coordsFromUrl(u){
  if (!u) return null;
  let m = u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || u.match(/[?&](?:q|query|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  return m ? {lat: +m[1], lng: +m[2]} : null;
}
async function importFile(f){
  const text = await f.text(); const base = f.name.replace(/\.[^.]+$/, "");
  let lists = [];
  try {
    if (/\.kml$/i.test(f.name) || /^\s*<\?xml|<kml/i.test(text)) lists = fromKML(text, base);
    else if (/^\s*[\[{]/.test(text)){
      const j = JSON.parse(text);
      if (j.lists) lists = normalize(j).lists;
      else if (j.type === "FeatureCollection") lists = fromGeoJSON(j, base);
      else throw new Error("Unrecognised JSON");
    } else lists = fromCSV(text, base);
  } catch(err){ toast("Couldn't read " + f.name + ": " + err.message); return; }
  if (!lists.length){ toast("No places found in " + f.name); return; }
  lists.forEach((l,i) => { l.id = uid(); l.color = l.color || COLORS[(S.lists.length + i) % COLORS.length]; l.visible = true; l.places.forEach(p => p.id = uid()); });
  commit(() => S.lists.push(...lists));
  const n = lists.reduce((a,l) => a + l.places.length, 0);
  toast(`Imported ${n} places into ${lists.length} list${lists.length>1?"s":""}`);
  ui.openList = lists.length === 1 ? lists[0].id : null; render(); lists.length === 1 ? fitList(lists[0]) : fitAll();
  await geocodeMissing(lists);
}
function fromCSV(text, base){
  const rows = parseCSV(text); if (rows.length < 2) return [];
  const H = rows[0].map(h => h.trim().toLowerCase());
  const col = (...names) => H.findIndex(h => names.includes(h));
  const ci = {list: col("list","layer","route","folder"), order: col("order","#","stop","seq","sequence"), name: col("name","title","place","location name"),
    addr: col("address","street","full address","location"), note: col("note","notes","comment","comments","description"),
    url: col("url","link","google maps url"), sm: col("site map","sitemap","site map link"), lat: col("lat","latitude","y"), lng: col("lng","lon","long","longitude","x")};
  const byList = new Map();
  rows.slice(1).forEach(r => {
    const g = k => ci[k] > -1 ? (r[ci[k]] || "").trim() : "";
    const ln = g("list") || base;
    if (!byList.has(ln)) byList.set(ln, []);
    let lat = parseFloat(g("lat")), lng = parseFloat(g("lng"));
    if (isNaN(lat) || isNaN(lng)){ const c = coordsFromUrl(g("url")); lat = c ? c.lat : null; lng = c ? c.lng : null; }
    const note = [g("note"), ci.note !== H.indexOf("comment") && H.includes("comment") ? r[H.indexOf("comment")] : ""].filter(Boolean).join("\n");
    byList.get(ln).push({order: parseFloat(g("order")), p: {name: g("name") || g("addr"), address: g("addr"), note, lat, lng, _url: g("url"), sitemap: g("sm")}});
  });
  return [...byList].map(([name, arr]) => { if (arr.every(x => !isNaN(x.order))) arr.sort((a,b) => a.order - b.order); return {name, places: arr.map(x => x.p)}; });
}
function fromGeoJSON(j, base){
  const byList = new Map();
  (j.features || []).forEach(f => { if (!f.geometry || f.geometry.type !== "Point") return; const pr = f.properties || {};
    const ln = pr.list || base; if (!byList.has(ln)) byList.set(ln, {color: pr.color, items: []});
    byList.get(ln).items.push({order: +pr.order, p: {name: pr.name || pr.Name || pr.title || "", address: pr.address || "", note: pr.note || pr.description || "", lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0]}}); });
  return [...byList].map(([name, v]) => { if (v.items.every(x => !isNaN(x.order))) v.items.sort((a,b) => a.order - b.order); return {name, color: v.color, places: v.items.map(x => x.p)}; });
}
function fromKML(text, base){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  const txt = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent.trim() : ""; };
  const lists = [];
  const toPlace = pm => { const c = txt(pm, "coordinates").split(/[\s]+/)[0].split(",");
    const name = txt(pm, "name").replace(/^\d+\.\s+/, "");
    const desc = txt(pm, "description").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "");
    return {name, address: txt(pm, "address"), note: desc, lat: c.length > 1 ? +c[1] : null, lng: c.length > 1 ? +c[0] : null}; };
  const folders = [...doc.getElementsByTagName("Folder")].filter(f => [...f.children].some(ch => ch.tagName === "Placemark"));
  folders.forEach(f => lists.push({name: [...f.children].find(c => c.tagName === "name")?.textContent.trim() || base,
    places: [...f.children].filter(c => c.tagName === "Placemark").map(toPlace)}));
  const loose = [...doc.getElementsByTagName("Placemark")].filter(pm => pm.parentElement.tagName !== "Folder");
  if (loose.length) lists.push({name: base, places: loose.map(toPlace)});
  return lists;
}
async function geocodeMissing(lists){
  const todo = []; lists.forEach(l => l.places.forEach(p => { if (!hasLoc(p) && (p.address || p.name)) todo.push(p); }));
  if (!todo.length) return;
  let ok = 0;
  for (let i = 0; i < todo.length; i++){
    const p = todo[i]; toast(`Finding locations… ${i+1} / ${todo.length}`, 2500);
    try { const r = await geocode(p.address || p.name, 1); if (r[0]){ p.lat = +r[0].lat.toFixed(6); p.lng = +r[0].lng.toFixed(6); if (!p.address) p.address = r[0].address; ok++; } } catch(e){}
    if (i % 5 === 4){ save(); renderMap(); }
    await sleep(1100); // Nominatim allows ~1 request per second
  }
  lists.forEach(l => l.places.forEach(p => delete p._url));
  save(); render();
  toast(`Located ${ok} of ${todo.length}. ${todo.length - ok ? "Use Edit → Set on map for the rest." : ""}`, 5000);
}

function routeLinks(places){
  // Google Maps directions links, max 10 stops each (origin + 8 waypoints + destination)
  const pts = places.filter(hasLoc), out = [];
  for (let i = 0; i < pts.length; i += 9){
    const seg = pts.slice(i, i + 10); if (seg.length < 2 && i > 0) break;
    const c = p => p.lat + "," + p.lng;
    if (seg.length === 1){ out.push({from: i+1, to: i+1, url: `https://www.google.com/maps/search/?api=1&query=${c(seg[0])}`}); break; }
    let u = `https://www.google.com/maps/dir/?api=1&origin=${c(seg[0])}&destination=${c(seg[seg.length-1])}&travelmode=driving`;
    if (seg.length > 2) u += "&waypoints=" + seg.slice(1, -1).map(c).join("%7C");
    out.push({from: i+1, to: i+seg.length, url: u});
  }
  return out;
}
function stopCount(l){ const n = new Set(l.places.map((p, i) => stopNum(p, i))); return n.size; }
function shareText(lists, perStop, routes){
  const parts = []; lists = pubLists(lists);
  lists.forEach(l => {
    const sc = stopCount(l);
    const lines = [`📍 ${l.name} (${sc} stop${sc===1?"":"s"})`];
    l.places.forEach((p, i) => {
      const hasNum = /^#\s*\d+/.test(p.note || "");
      let s = hasNum ? `${p.name || "Untitled"}` : `${i+1}. ${p.name || "Untitled"}`;
      if (p.address && p.address !== p.name) s += ` | ${p.address}`;
      if (p.note) s = hasNum ? `${p.note.replace(/\n+/g, " / ")}\n   ${s}` : s + `\n   ${p.note.replace(/\n+/g, " / ")}`;
      if (perStop && hasLoc(p)) s += `\n   https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
      if (p.smimg && SM[p.smimg]) s += `\n   Site map: in the map file (tap 📄 Site map)`;
      else if (p.sitemap) s += `\n   Site map: ${p.sitemap}`;
      lines.push(s);
    });
    if (routes){
      const rl = routeLinks(l.places);
      if (rl.length) lines.push("", rl.length === 1 ? "Route in Google Maps:" : "Route in Google Maps (in parts, 10 pins max per link):",
        ...rl.map(r => (rl.length > 1 ? `Pins ${r.from}-${r.to}: ` : "") + r.url));
    }
    parts.push(lines.join("\n"));
  });
  return parts.join("\n\n");
}
function routeFile(lists){

  sub.lists.forEach(l => l.visible = true);
  sub.id = "share-" + lists.map(l => l.id).join("-").slice(0, 40);
  sub.title = lists.length === 1 ? lists[0].name : S.title;
  sub.savedAt = Date.now();
  sub.showLines = true;
  const data = JSON.stringify(sub).replace(/</g, "\\u003c").replace(/[\u2028\u2029]/g, c => "\\u" + c.charCodeAt(0).toString(16));
  const used = {}; sub.lists.forEach(l => l.places.forEach(p => { if (p.smimg && SM[p.smimg]) used[p.smimg] = SM[p.smimg]; }));
  const smData = Object.keys(used).length ? JSON.stringify(used) : "null";

                     .replace(/\/\*SM_START\*\/[\s\S]*?\/\*SM_END\*\//, () => "/*SM_START*/" + smData + "/*SM_END*/");

  try { if (navigator.permissions && navigator.permissions.query) return (await navigator.permissions.query({name: "geolocation"})).state; } catch(e){}
  return "prompt";
}

// Shows our own explanation first, then triggers the browser's permission prompt from a tap.
function askLocation(fromUser, then){
  return new Promise(async resolve => {
    if (!navigator.geolocation){ toast("This browser can't use GPS"); return resolve(false); }
    const st = await locState();
    if (st === "granted"){ then && then(); return resolve(true); }
    if (st === "denied"){ locHelp(); return resolve(false); }
    $("#dlgBody").innerHTML = `<div style="text-align:center"><div style="font-size:52px;line-height:1">📍</div>
      <h3 style="margin:8px 0">Turn on location?</h3>
      <p>Drive mode uses your phone's GPS to show where you are and give turn-by-turn directions to each stop on the route.</p>
      <p style="font-size:14px;color:#6b7385">Next, your browser will ask to allow location. Tap <b>Allow</b> (or <b>While using the app</b>). Your location stays on this device and isn't saved or shared.</p></div>
      <footer style="justify-content:center"><button class="btn" id="lpLater">Not now</button><button class="btn primary" id="lpAllow">📍 Allow location</button></footer>`;
    const d = $("#dlg"); if (!d.open) d.showModal();
    $("#lpLater").onclick = () => { d.close(); lsSet("routemaps:locLater", Date.now()); resolve(false); };
    $("#lpAllow").onclick = () => {
      $("#lpAllow").disabled = true; $("#lpAllow").textContent = "Waiting for your browser…";
      navigator.geolocation.getCurrentPosition(
        () => { d.close(); toast("Location is on. Tap 🚗 Drive to start."); then && then(); resolve(true); },
        err => { d.close(); if (err.code === 1) locHelp(); else { toast("Couldn't get a GPS fix yet. Make sure Location is turned on."); } resolve(false); },
        {enableHighAccuracy: true, timeout: 20000, maximumAge: 60000});
    };
  });
}

  const subKey = window.__rmSubKey = async (keyB64, label) => {
    const k = await crypto.subtle.importKey("raw", b64d(keyB64), {name: "HMAC", hash: "SHA-256"}, false, ["sign"]);
    const sig = new Uint8Array(await crypto.subtle.sign("HMAC", k, new TextEncoder().encode(label)));
    let s = ""; sig.forEach(c => s += String.fromCharCode(c)); return btoa(s);
  };
  async function openRun(id, k, admin){
    const r = runs.runs[id]; if (!r || !k) return null;
    if (typeof k === "object" && k.k){                      // some properties only, on a site published the old way: open the run, keep just those stops
      const o = await openRun(id, k.k, admin); if (!o) return null;
      const only = new Set((k.only || []).map(String)), num = (p, i) => { const m = /^#\s*(\d+)/.exec(p.note || ""); return m ? m[1] : (p.stopNo || String(i + 1)); };
      o.list.places = o.list.places.map((p, i) => ({...p, stopNo: num(p, i)})).filter(p => only.has(p.stopNo));
      return o.list.places.length ? o : null;
    }
    if (typeof r === "string") return typeof k === "string" ? decRaw(r, k) : null;           // v1 file (whole run, one key)
    const full = typeof k === "string";
    const head = await decRaw(r.h, full ? await subKey(k, "head") : k.h); if (!head) return null;
    const list = head.list, sm = {}; list.places = [];
    const parts = await Promise.all(r.s.map(async ([num, blob]) => {
      const sk = full ? await subKey(k, "stop:" + num) : (k.s || {})[num];
      return sk ? decRaw(blob, sk) : null;
    }));
    parts.forEach((o, i) => { if (!o) return; o.places.forEach(p => { if (admin) delete p.stopNo; list.places.push(p); }); Object.assign(sm, o.sm || {}); });
    if (!full && !list.places.length) return null;
    return {list, sm};
  }
  async function openWith(access){
    const lists = [], sm = {};
    window.__RUNS_V = runs.v || 1;
    for (const id of runs.order){
      const o = await openRun(id, access.keys[id], access.role === "admin"); if (!o) continue;
      lists.push(o.list); Object.assign(sm, o.sm || {});
    }
    window.__FROM_SITE = true; window.__ACCESS = access;
    window.EMBEDDED_MAP = {...meta, lists};
    window.EMBEDDED_SITEMAPS = sm;
    return true;
  }
  async function adminOpen(pw){
    try {
      const r = await fetch("keys.enc", {cache: "no-cache"}); if (!r.ok) return false;
      const o = await decPw(new Uint8Array(await r.arrayBuffer()), pw); if (!o) return false;
      window.__ADMIN_PW = pw;
      return openWith({role: "admin", name: "Admin", keys: o.keys, logKey: o.logKey, signedAt: Date.now()});
    } catch(e){ return false; }
  }
  // Ask the office sheet which runs this PIN may see right now.
  const device = () => { const u = navigator.userAgent;
    const os = /Android/i.test(u) ? "Android" : /iPhone|iPad/i.test(u) ? "iPhone" : /Windows/i.test(u) ? "Windows" : /Mac/i.test(u) ? "Mac" : "Other";
    const br = /SamsungBrowser/i.test(u) ? "Samsung Internet" : /Edg\//i.test(u) ? "Edge" : /CriOS|Chrome/i.test(u) ? "Chrome" : /Safari/i.test(u) ? "Safari" : /Firefox/i.test(u) ? "Firefox" : "Browser";
    return os + " · " + br; };
  async function driverLogin(pin, how){
    try { const j = await api({action: "login", pin, log: how, device: device()}); return j; } catch(e){ return null; }
  }
  const wantAdmin = /[#&]admin\b/.test(location.hash);
  const clearHash = () => history.replaceState(null, "", location.pathname + location.search);
  let stored = null; try { stored = JSON.parse(localStorage.getItem("routemaps:access")); } catch(e){}
  if (!wantAdmin && stored){
    if (stored.role === "admin"){ if (await adminOpen(stored.pw)) return run(); store(null); }
    else if (stored.pin){
      const j = await driverLogin(stored.pin, "Opened the app");
      if (j && j.ok){ const a = {role: "crew", name: j.name, keys: j.keys || {}, logKey: j.logKey || "", pin: stored.pin, runs: j.runs || [], kind: j.kind || "driver", driverName: j.driverName || "", truck: j.truck || "", signedAt: stored.signedAt || Date.now()}; store(a); await openWith(a); return run(); }
      if (j && !j.ok && (j.error === "bad pin" || j.error === "expired")) store(null);   // removed, PIN changed or guest access ended
      else { await openWith({...stored, offline: true, signedAt: Date.now()}); return run(); }        // no signal: use what this phone already has
    }
  }

  // ---------- sign-in screen ----------
  const box = document.createElement("div"); box.id = "unlock";
  box.style.cssText = "position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:20px;background:#eef1f5;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#202124";
  const field = 'width:100%;box-sizing:border-box;font-size:20px;padding:12px 14px;border:1px solid #c4c7cc;border-radius:10px';
  const btn = 'width:100%;font-size:18px;padding:12px;border:0;border-radius:10px;background:#1a73e8;color:#fff;font-weight:600;margin-top:12px;cursor:pointer';
  function screen(mode){
    const head = `<div style="font-size:46px;line-height:1">${mode === "admin" ? "🔒" : "🔑"}</div><h2 style="margin:8px 0 4px;font-size:22px">${meta.title || "SALT Routes"}</h2>`;
    const body = mode === "admin"
      ? `<p style="margin:0 0 14px;color:#5f6368">Admin Sign-In</p>
        <form id="ulForm"><input id="ulPw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Admin password" style="${field}">
        <button style="${btn}">Admin Sign-In</button><p id="ulErr" style="color:#d93025;min-height:22px;margin:10px 0 0"></p></form>`
      : `<p style="margin:0 0 14px;color:#5f6368">Drivers: enter the PIN the office gave you.</p>
        <form id="ulForm"><input id="ulPin" autocomplete="off" inputmode="numeric" pattern="[0-9]*" spellcheck="false" placeholder="4-digit PIN" style="${field};text-align:center;letter-spacing:.3em;font-size:26px">
        <button style="${btn}">Crew Sign-In</button><p id="ulErr" style="color:#d93025;min-height:22px;margin:10px 0 0"></p></form>`;
    const foot = mode === "admin" ? `<a href="#" id="ulBack" style="color:#5f6368;font-size:15px;font-weight:600">Crew Sign-In</a>` : `<a href="#" id="ulAdmin" style="display:inline-block;background:#d93025;color:#fff;font-weight:700;font-size:17px;padding:10px 22px;border-radius:10px;text-decoration:none">🔑 Admin Sign-In</a>`;
    const langLink = `<a href="#" id="ulLang" style="display:inline-block;margin-top:14px;color:#5f6368;font-size:15px;text-decoration:none">${window.__LANG === "es" ? "English" : "Español " + window.__flagMX}</a>`;
    box.innerHTML = `<div style="background:#fff;border-radius:16px;padding:26px 22px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.18);text-align:center">${head}${body}<div style="margin-top:14px">${foot}</div>${langLink}</div>`;
    const ll = box.querySelector("#ulLang"); if (ll) ll.onclick = e => { e.preventDefault(); window.__setLang(window.__LANG === "es" ? "en" : "es"); };
    const a = box.querySelector("#ulAdmin"), bk = box.querySelector("#ulBack");
    if (a) a.onclick = e => { e.preventDefault(); screen("admin"); };
    if (bk) bk.onclick = e => { e.preventDefault(); screen("pin"); };
    const f = box.querySelector("#ulForm"), inp = f.querySelector("input"), err = f.querySelector("#ulErr"), go = f.querySelector("button"); inp.focus();
    f.onsubmit = async e => {
      e.preventDefault(); err.textContent = ""; go.disabled = true; const label = go.textContent; go.textContent = "Signing in…";
      let okd = false;
      if (mode === "pin"){
        const pin = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
        const j = pin ? await driverLogin(pin, "Signed in with PIN") : null;
        if (!j) err.textContent = "Couldn't reach the office. Check your signal and try again.";
        else if (!j.ok) err.textContent = j.error === "locked" ? "Too many wrong PINs. Wait 10 minutes and try again." : j.error === "expired" ? "Your guest access has ended. Ask the office for a new PIN." : "That PIN isn't right. Check it and try again.";
        else { const acc = {role: "crew", name: j.name, keys: j.keys || {}, logKey: j.logKey || "", pin, runs: j.runs || [], kind: j.kind || "driver", driverName: j.driverName || "", truck: j.truck || "", signedAt: Date.now(), fresh: true}; store(acc); await openWith(acc); okd = true; }
      } else {
        if (await adminOpen(inp.value)){ store({role: "admin", pw: inp.value}); okd = true; } else err.textContent = "Wrong password.";
      }
      if (okd){ clearHash(); box.remove(); run(); } else { go.disabled = false; go.textContent = label; inp.select(); }
    };
  }
  document.body.appendChild(box); window.__bootDone();
  screen(wantAdmin ? "admin" : "pin");
})();
</script>
</body>
</html>
